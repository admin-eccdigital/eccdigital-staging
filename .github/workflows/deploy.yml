name: Deploy to GitHub Pages

on:
  push:
    branches: [staging, main]
  # Trigger from the content repo when an editor saves an article
  repository_dispatch:
    types: [content-update]
  # Manual trigger from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Pull the latest content submodule on every build
          submodules: true
          token: ${{ secrets.CONTENT_REPO_TOKEN || secrets.GITHUB_TOKEN }}

      # When triggered by repository_dispatch from content repo, the submodule
      # pointer in this repo may be stale — fetch latest content/main directly.
      - name: Update content submodule to latest
        run: |
          cd content
          git fetch origin main
          git checkout origin/main

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci --legacy-peer-deps

      # Use npm run build (not `npx next build`) so the `prebuild` hook
      # fires and scripts/sync-content.mjs copies content/uploads/ → public/uploads/
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
